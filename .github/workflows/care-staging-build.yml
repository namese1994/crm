name: Care staging build

on:
  push:
    branches: [codex/customer-care]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://synthetic@127.0.0.1:65500/crm_build_test
      TEST_DATABASE_URL: postgresql://synthetic@127.0.0.1:65500/crm_build_test
      BETTER_AUTH_SECRET: synthetic-build-only-secret-not-used-by-runtime
      GOOGLE_CLIENT_ID: synthetic-build-only
      GOOGLE_CLIENT_SECRET: synthetic-build-only
      ALLOWED_SIGN_IN: example.invalid
      API_URL: http://127.0.0.1:3211
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3211
      APP_URL: https://essentially-athens-acdbentity-fed.trycloudflare.com
      CRM_CARE_MODE: "true"
      CRM_CARE_PASSWORD_AUTH: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter=@crm/db db:generate
      - run: bun run build
        working-directory: apps/app
      - name: Package web artifact
        run: |
          printf '%s\n' "$GITHUB_SHA" > apps/app/.next/care-source-revision.txt
          tar --exclude=.next/cache -C apps/app -czf care-web.tar.gz .next
          sha256sum care-web.tar.gz > care-web.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: care-staging-web-${{ github.sha }}
          path: |
            care-web.tar.gz
            care-web.tar.gz.sha256
          retention-days: 1
